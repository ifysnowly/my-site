/* Смешные «достоверности» в углу карточки */
const CERTS = [
  "достоверно на 100% (по мнению бобров)",
  "почти точно",
  "подтверждено рыбами",
  "источник: семейная разведка",
  "проверено гаражом",
  "достоверность: как повезёт"
];
/* ============================================================ */

const DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const scheduleFor = (person, d) => { const w = d.getDay(); return person[w === 0 ? "sunday" : w === 6 ? "saturday" : "weekday"]; };
const currentIndex = (sched, minutes) => { let idx = 0; sched.forEach((s, i) => { if (toMin(s.start) <= minutes) idx = i; }); return idx; };

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

let selected = "papa";
let shift = 0;
let shownKey = "";
const extraCount = {};

function render() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  const person = PEOPLE[selected];
  const sched = scheduleFor(person, now);
  const idx = currentIndex(sched, minutes);
  const slot = sched[idx];
  const key = selected + "-" + now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate() + "#" + idx;
  if (key !== shownKey) { shift = 0; shownKey = key; }

  $("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  $("date").textContent = DAYS[now.getDay()] + ", " + now.getDate() + " " + MONTHS[now.getMonth()];

  const n = slot.phrases.length;
  $("label").textContent = person.name + " сейчас";
  $("place").textContent = slot.place;
  $("phrase").textContent = slot.phrases[(hash(key) + shift) % n];
  const end = idx + 1 < sched.length ? sched[idx + 1].start : "00:00";
  $("range").textContent = "с " + slot.start + " до " + end;
  $("cert").textContent = CERTS[hash(key + "c") % CERTS.length];
  $("roast").textContent = person.roasts[(hash(key + "r") + shift) % person.roasts.length];
  $("another").hidden = n < 2;
  $("extra").textContent = person.button;

  const nav = $("family");
  nav.textContent = "";
  Object.keys(PEOPLE).forEach((id) => {
    const p = PEOPLE[id];
    const s = scheduleFor(p, now);
    const cur = s[currentIndex(s, minutes)];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "who";
    b.setAttribute("aria-pressed", id === selected ? "true" : "false");
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = p.name;
    const wh = document.createElement("span"); wh.className = "where"; wh.textContent = cur.place;
    b.append(nm, wh);
    b.addEventListener("click", () => { selected = id; $("alert").hidden = true; render(); });
    nav.appendChild(b);
  });

  const list = $("timetable");
  list.textContent = "";
  sched.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i < idx ? " past" : i === idx ? " current" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = s.start;
    const p = document.createElement("span"); p.className = "p"; p.textContent = s.place;
    const tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = i === idx ? "сейчас" : i < idx ? "" : "позже";
    li.append(t, p, tag);
    list.appendChild(li);
  });
}

$("another").addEventListener("click", () => { shift += 1; render(); });

$("extra").addEventListener("click", () => {
  const person = PEOPLE[selected];
  const c = extraCount[selected] || 0;
  extraCount[selected] = c + 1;
  const box = $("alert");
  box.textContent = person.messages[c % person.messages.length];
  box.hidden = false;
  const card = $("now");
  card.classList.remove("pulse");
  void card.offsetWidth;
  card.classList.add("pulse");
});

render();
setInterval(render, 20000);
</script>
